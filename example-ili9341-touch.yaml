# Fujitsu AirStage-H controller with an ILI9341 SPI touchscreen (XPT2046).
# Shows current + set temperature and provides on-screen Power / Temp Up / Temp Down buttons.
#
# Wiring assumed (adjust to your board):
#   Fujitsu 3-wire bus transceiver: TX GPIO17, RX GPIO16
#   SPI: CLK GPIO18, MOSI GPIO23, MISO GPIO19
#   Display: CS GPIO5, DC GPIO4, RESET GPIO2
#   Touch: CS GPIO27, IRQ GPIO33

substitutions:
  device_name: halcyon-controller
  friendly_name: Halcyon Controller

external_components:
  - source: github://a10kiloham/esphome-fujitsu-halcyon

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: nodemcu-32s  # match your board
  framework:
    type: esp-idf  # required by the fujitsu-halcyon component

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 500
  parity: EVEN

climate:
  - platform: fujitsu-halcyon
    name: None  # Use device friendly_name
    id: arxd12
    controller_address: 1  # 0=Primary, 1=Secondary (use 1 if a wall controller is also connected)
    # IDs so the display lambda can show boot/bus diagnostics
    initialization_stage:
      name: Initialization Stage
      id: fuji_init_stage
    connected:
      name: Connected
      id: fuji_connected

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
  - file: "gfonts://Roboto"
    id: font_big
    size: 40

display:
  - platform: ili9xxx
    model: ili9341
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO2
    invert_colors: false
    rotation: 90  # 320x240 landscape to match the button coordinates below
    id: tft
    update_interval: 1s
    lambda: |-
      auto fuji = id(arxd12);

      // Diagnostic screen until the bus handshake completes (also shown if
      // the communication watchdog drops the connection later)
      if (!id(fuji_connected).state) {
        it.print(10, 10, id(font_small), "Connecting to unit...");
        it.printf(10, 40, id(font_small), "Bus: %s", id(fuji_init_stage).state.c_str());
        it.printf(10, 70, id(font_small), "WiFi: %s",
                  wifi::global_wifi_component->is_connected() ? "connected" : "connecting...");
        it.printf(10, 100, id(font_small), "HA API: %s",
                  api::global_api_server->is_connected() ? "connected" : "waiting...");
        return;
      }

      // Status + temps top half
      if (std::isnan(fuji->current_temperature))
        it.print(10, 10, id(font_big), "--.-°C");
      else
        it.printf(10, 10, id(font_big), "%.1f°C", fuji->current_temperature);

      if (std::isnan(fuji->target_temperature))
        it.print(10, 60, id(font_small), "Set: --°C");
      else
        it.printf(10, 60, id(font_small), "Set: %.0f°C", fuji->target_temperature);

      it.print(10, 90, id(font_small),
               fuji->mode == climate::CLIMATE_MODE_OFF ? "OFF" : "ON");

      // Buttons bottom half
      it.rectangle(10, 130, 90, 60);   it.print(35, 150, id(font_small), "ON/OFF");
      it.rectangle(120, 130, 90, 60);  it.print(155, 140, id(font_big), "+");
      it.rectangle(220, 130, 90, 60);  it.print(255, 140, id(font_big), "-");

touchscreen:
  - platform: xpt2046
    id: touch
    cs_pin: GPIO27
    interrupt_pin: GPIO33
    display: tft
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    # If touches land in the wrong place, adjust for your panel:
    #transform:
    #  swap_xy: true
    #  mirror_x: false
    #  mirror_y: true
    on_release:
      - component.update: tft

binary_sensor:
  - platform: touchscreen
    name: "Power Button"
    x_min: 10
    x_max: 100
    y_min: 130
    y_max: 190
    on_press:
      - lambda: |-
          auto call = id(arxd12).make_call();
          call.set_mode(id(arxd12).mode == climate::CLIMATE_MODE_OFF
                        ? climate::CLIMATE_MODE_HEAT_COOL
                        : climate::CLIMATE_MODE_OFF);
          call.perform();

  - platform: touchscreen
    name: "Temp Up"
    x_min: 120
    x_max: 210
    y_min: 130
    y_max: 190
    on_press:
      - lambda: |-
          auto t = id(arxd12).target_temperature;
          if (std::isnan(t)) return;
          auto call = id(arxd12).make_call();
          call.set_target_temperature(std::min(t + 1.0f, 30.0f));
          call.perform();

  - platform: touchscreen
    name: "Temp Down"
    x_min: 220
    x_max: 310
    y_min: 130
    y_max: 190
    on_press:
      - lambda: |-
          auto t = id(arxd12).target_temperature;
          if (std::isnan(t)) return;
          auto call = id(arxd12).make_call();
          call.set_target_temperature(std::max(t - 1.0f, 16.0f));
          call.perform();
