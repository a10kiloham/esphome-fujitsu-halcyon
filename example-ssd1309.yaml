# Fujitsu AirStage-H controller on an M5Stack AtomS3 Lite + FOSV Fuji-Atom-Interface,
# with an SSD1309/SSD1306 128x64 OLED on I2C via the Grove connector.
# Shows current + set temperature; two physical push buttons adjust the setpoint.
#
# See WIRING.md for the full wiring diagram (including the SPI alternative for
# SPI-only OLED modules). Summary:
#   Fujitsu bus (FOSV base): TX G5, RX G6 (fixed by the FOSV PCB)
#   OLED (I2C): SDA G1, SCL G2 (Grove white/yellow), VCC Grove 5V*, GND Grove GND
#     * most 4-pin I2C OLED modules accept 3.3-5V - check yours
#   Buttons (to GND): Temp Up G7, Temp Down G8

substitutions:
  device_name: halcyon-controller
  friendly_name: Halcyon Controller

external_components:
  - source: github://a10kiloham/esphome-fujitsu-halcyon

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf  # required by the fujitsu-halcyon component

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:

uart:
  tx_pin: GPIO5  # FOSV Fuji-Atom-Interface on AtomS3 Lite
  rx_pin: GPIO6
  baud_rate: 500
  parity: EVEN

climate:
  - platform: fujitsu-halcyon
    name: None  # Use device friendly_name
    id: arxd12
    controller_address: 1  # 0=Primary, 1=Secondary (use 1 if a wall controller is also connected)
    # IDs so the display lambda can show boot/bus diagnostics
    initialization_stage:
      name: Initialization Stage
      id: fuji_init_stage
    connected:
      name: Connected
      id: fuji_connected

i2c:
  sda: GPIO1
  scl: GPIO2

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 24

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"  # SSD1309 panels are driver compatible with the SSD1306 model
    address: 0x3C
    id: oled
    update_interval: 1s
    lambda: |-
      auto fuji = id(arxd12);

      // Diagnostic screen until the bus handshake completes (also shown if
      // the communication watchdog drops the connection later)
      if (!id(fuji_connected).state) {
        it.print(0, 0, id(font_small), "Connecting to unit...");
        it.printf(0, 16, id(font_small), "Bus: %s", id(fuji_init_stage).state.c_str());
        it.printf(0, 32, id(font_small), "WiFi: %s",
                  wifi::global_wifi_component->is_connected() ? "OK" : "...");
        it.printf(0, 48, id(font_small), "HA API: %s",
                  api::global_api_server->is_connected() ? "OK" : "...");
        return;
      }

      it.print(0, 0, id(font_small),
               fuji->mode == climate::CLIMATE_MODE_OFF ? "Status: OFF" : "Status: RUNNING");

      if (std::isnan(fuji->current_temperature))
        it.print(0, 16, id(font_big), "--.-°C");
      else
        it.printf(0, 16, id(font_big), "%.1f°C", fuji->current_temperature);

      if (std::isnan(fuji->target_temperature))
        it.print(0, 48, id(font_small), "Set: --°C");
      else
        it.printf(0, 48, id(font_small), "Set: %.0f°C", fuji->target_temperature);

binary_sensor:
  - platform: gpio
    name: "Temp Up"
    pin:
      number: GPIO7
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - lambda: |-
          auto t = id(arxd12).target_temperature;
          if (std::isnan(t)) return;
          auto call = id(arxd12).make_call();
          call.set_target_temperature(std::min(t + 1.0f, 30.0f));
          call.perform();
      - component.update: oled

  - platform: gpio
    name: "Temp Down"
    pin:
      number: GPIO8
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - lambda: |-
          auto t = id(arxd12).target_temperature;
          if (std::isnan(t)) return;
          auto call = id(arxd12).make_call();
          call.set_target_temperature(std::max(t - 1.0f, 16.0f));
          call.perform();
      - component.update: oled
